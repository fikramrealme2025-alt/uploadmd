name: Build libblackbox.so

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/src/main/cpp/**'

jobs:
  ndk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ndk-build (arm64-v8a + armeabi-v7a)
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=$PWD/app/src/main \
            APP_BUILD_SCRIPT=$PWD/app/src/main/cpp/Android.mk \
            NDK_APPLICATION_MK=$PWD/app/src/main/cpp/Application.mk \
            NDK_LIBS_OUT=$PWD/app/src/main/jniLibs \
            NDK_OUT=/tmp/ndk-obj
          find app/src/main/jniLibs -name '*.so'

      - uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: app/src/main/jniLibs
